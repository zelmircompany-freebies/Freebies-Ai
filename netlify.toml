# 1. Проксируем запросы к API на Vercel (где лежат серверные функции)
[[redirects]]
  from = "/api/*"
  to = "https://freebies-ai.vercel.app/api/:splat"
  status = 200
  force = true

# 2. Правильная маршрутизация для SPA (чтобы загружался главный лендинг)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
